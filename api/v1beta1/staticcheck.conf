# Spoke pinned to CAPI core/v1beta1 APIEndpoint (see c82a9f9) — preserves
# the pre-v1.13 spoke CRD schema, avoiding the MinProperties=1 tightening
# from v1beta2 APIEndpoint that would break existing consumers who send
# zero-valued controlPlaneEndpoint. SA1019 fires on the intentional
# deprecated import in both hand-written and zz_generated.conversion.go
# files; suppress it here rather than sprinkling per-file directives.
#
# `-SA1019` alone subtracts the check from the default set (keeps every
# other SA check active). Don't add `"all"` — it expands the check set
# to include the ST family, which was never previously enforced.
checks = ["-SA1019"]
